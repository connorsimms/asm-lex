[workspace]
members = ["asm-lex", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.70.0"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.bench]
debug = 1
strip = false
lto = "fat"
codegen-units = 1

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
