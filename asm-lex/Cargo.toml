[package]
name = "asm-lex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
memchr = { version = "2.8.0", default-features = false, optional = true }

[features]
default = ["std", "memchr"]
std = ["memchr?/std"]
memchr = ["dep:memchr"]

[dev-dependencies]
pretty_assertions = "1.0.0"
proptest = { version = "1.11.0", features = ["std"] }
insta = { version = "1.48.0", features = ["glob"] }
criterion = "0.8.2"

[[bench]]
name = "criterion_gas"
harness = false
